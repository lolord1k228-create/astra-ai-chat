<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Вогник & Монети</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#0b0e14;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#e8edf5;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:12px}
#app{max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px;padding-bottom:30px}
.profile-card{background:#1a1f2b;border-radius:20px;padding:16px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 4px 20px rgba(0,0,0,.5);border:1px solid #2a3140}
.avatar-wrap{position:relative;width:56px;height:56px;flex-shrink:0}
.avatar{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ea580c);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;box-shadow:0 0 16px rgba(245,158,11,.5);overflow:hidden;position:relative;border:2px solid rgba(255,255,255,.08)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar-letter{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;z-index:1}
.avatar-status{position:absolute;bottom:-1px;right:-1px;width:16px;height:16px;border-radius:50%;background:#4ade80;border:3px solid #1a1f2b;box-shadow:0 0 10px rgba(74,222,128,.7);z-index:2;transition:all .4s}
.avatar-status.offline{background:#ef4444;box-shadow:0 0 10px rgba(239,68,68,.7)}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f1f5f9}
.profile-id{font-size:12px;color:#6b7a90;margin-top:2px}
.resources{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.resource-item{background:#1a1f2b;border-radius:16px;padding:12px 6px;text-align:center;border:1px solid #2a3140;box-shadow:0 2px 12px rgba(0,0,0,.4)}
.resource-emoji{font-size:24px;display:block;margin-bottom:4px}
.resource-value{font-size:20px;font-weight:700}
.resource-label{font-size:10px;color:#6b7a90;text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
.coins .resource-value{color:#fbbf24;text-shadow:0 0 12px rgba(251,191,36,.4)}
.stars .resource-value{color:#f59e0b;text-shadow:0 0 12px rgba(245,158,11,.4)}
.days .resource-value{color:#38bdf8;text-shadow:0 0 12px rgba(56,189,248,.4)}
.flame-card{background:#1a1f2b;border-radius:24px;padding:28px 20px 22px;text-align:center;border:1px solid #2a3140;box-shadow:0 4px 24px rgba(0,0,0,.5);transition:all .5s;position:relative;overflow:hidden}
.flame-card.alive{border-color:rgba(245,158,11,.35);box-shadow:0 0 35px rgba(245,158,11,.15),0 4px 24px rgba(0,0,0,.5)}
.flame-card.dead{background:#15181f;border-color:#2a3140;filter:grayscale(.7)}
.flame-emoji{font-size:80px;line-height:1;display:block;margin-bottom:14px;transition:all .5s}
.flame-card.alive .flame-emoji{animation:pulseFlame 1.6s ease-in-out infinite;filter:drop-shadow(0 0 28px rgba(245,158,11,.75))}
.flame-card.dead .flame-emoji{opacity:.45;filter:grayscale(1);animation:none}
@keyframes pulseFlame{0%,100%{transform:scale(1);filter:drop-shadow(0 0 22px rgba(245,158,11,.6))}50%{transform:scale(1.1);filter:drop-shadow(0 0 42px rgba(245,158,11,.95))}}
.flame-status{font-size:15px;font-weight:600;margin-bottom:6px}
.flame-card.alive .flame-status{color:#4ade80}
.flame-card.dead .flame-status{color:#ef4444}
.timer{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px;margin-bottom:6px;transition:color .3s}
.timer.green{color:#4ade80;text-shadow:0 0 14px rgba(74,222,128,.45)}
.timer.orange{color:#fb923c;text-shadow:0 0 14px rgba(251,146,60,.45)}
.timer.red{color:#ef4444;text-shadow:0 0 14px rgba(239,68,68,.45);animation:blinkRed 1s ease-in-out infinite}
@keyframes blinkRed{0%,100%{opacity:1}50%{opacity:.5}}
.timer-label{font-size:11px;color:#6b7a90;text-transform:uppercase;letter-spacing:.8px}
.btn{width:100%;padding:16px;border:none;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;letter-spacing:.3px;position:relative;overflow:hidden}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6)}
.btn-feed{background:linear-gradient(135deg,#f59e0b,#ea580c);color:#fff;box-shadow:0 4px 22px rgba(245,158,11,.4)}
.btn-rescue{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;box-shadow:0 4px 22px rgba(239,68,68,.4)}
.btn-buy{background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1f2b;box-shadow:0 4px 22px rgba(251,191,36,.35)}
.actions{display:flex;flex-direction:column;gap:10px}
.shop{background:#1a1f2b;border-radius:20px;padding:16px;border:1px solid #2a3140;box-shadow:0 4px 20px rgba(0,0,0,.45)}
.shop-title{font-size:15px;font-weight:700;color:#fbbf24;margin-bottom:12px;text-align:center;letter-spacing:.8px;text-transform:uppercase;text-shadow:0 0 18px rgba(251,191,36,.35)}
.shop-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#12161f;margin-bottom:8px;transition:all .2s;border:1px solid #2a3140}
.shop-item:last-child{margin-bottom:0}
.shop-item:active{transform:scale(.98)}
.shop-icon{font-size:32px;flex-shrink:0;width:44px;text-align:center}
.shop-info{flex:1;min-width:0}
.shop-name{font-size:14px;font-weight:600;color:#f1f5f9}
.shop-desc{font-size:11px;color:#6b7a90;margin-top:2px}
.shop-buy{background:linear-gradient(135deg,#fbbf24,#d97706);color:#1a1f2b;border:none;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0;font-family:inherit;transition:all .2s;box-shadow:0 2px 10px rgba(251,191,36,.3)}
.shop-buy:active{transform:scale(.95)}
.shop-buy:disabled{opacity:.4;cursor:not-allowed}
.leaderboard{background:#1a1f2b;border-radius:20px;padding:16px;border:1px solid #2a3140;box-shadow:0 4px 20px rgba(0,0,0,.45)}
.leaderboard-title{font-size:15px;font-weight:700;color:#fbbf24;margin-bottom:12px;text-align:center;letter-spacing:.8px;text-transform:uppercase;text-shadow:0 0 18px rgba(251,191,36,.35)}
.lb-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;margin-bottom:6px;background:#12161f;transition:all .3s;border:2px solid transparent}
.lb-row:last-child{margin-bottom:0}
.lb-row.current-user{border-color:#3b82f6;background:rgba(59,130,246,.12);box-shadow:0 0 16px rgba(59,130,246,.25)}
.lb-rank{font-size:14px;font-weight:700;width:26px;text-align:center;flex-shrink:0}
.lb-rank.gold{color:#fbbf24;text-shadow:0 0 10px rgba(251,191,36,.6)}
.lb-rank.silver{color:#cbd5e1;text-shadow:0 0 10px rgba(203,213,225,.5)}
.lb-rank.bronze{color:#d97706;text-shadow:0 0 10px rgba(217,119,6,.5)}
.lb-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.lb-avatar img{width:100%;height:100%;object-fit:cover}
.lb-name{flex:1;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#e8edf5}
.lb-days{font-size:14px;font-weight:700;color:#38bdf8;flex-shrink:0;text-shadow:0 0 10px rgba(56,189,248,.35)}
.lb-empty{text-align:center;color:#6b7a90;font-size:13px;padding:16px 0}
.loading{position:fixed;inset:0;background:#0b0e14;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:999;transition:opacity .5s}
.loading.hidden{opacity:0;pointer-events:none}
.loading-spinner{width:48px;height:48px;border:4px solid #2a3140;border-top-color:#f59e0b;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:14px;color:#6b7a90}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:#1a1f2b;border:1px solid #2a3140;border-radius:14px;padding:12px 20px;font-size:14px;font-weight:500;color:#e8edf5;box-shadow:0 8px 32px rgba(0,0,0,.6);z-index:1000;transition:all .35s;opacity:0;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
</head>
<body>
<div id="app">
<div class="profile-card">
<div class="avatar-wrap">
<div class="avatar" id="avatarBox"><span class="avatar-letter" id="avatarLetter">?</span></div>
<div class="avatar-status" id="avatarStatus"></div>
</div>
<div class="profile-info">
<div class="profile-name" id="profileName">Завантаження...</div>

</div>
</div>
<div class="resources">
<div class="resource-item coins"><span class="resource-emoji">🪙</span><div class="resource-value" id="coinsValue">0</div><div class="resource-label">Монети</div></div>

</div>

<!-- 🛒 МАГАЗИН -->
<div class="shop">
<div class="shop-title">🛒 Магазин монет</div>
<div class="shop-item">

</div>

</div>

</div>

<div class="leaderboard">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, orderBy, limit, onSnapshot, serverTimestamp, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyC53lY7Byyx0YWADr0BRlR-iWKIxF3SR-M",
authDomain: "fire-24f1d.firebaseapp.com",
projectId: "fire-24f1d",
storageBucket: "fire-24f1d.firebasestorage.app",
messagingSenderId: "710685292251",
appId: "1:710685292251:web:4bc12ffc66cf0917463efe"
};

const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

let userId = "test_user_123";
let userName = "Тестовий Гравець";
let userLastName = "";
let userPhotoUrl = "";

if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
const u = tg.initDataUnsafe.user;
userId = String(u.id);
userName = u.first_name || "Гравець";
userLastName = u.last_name || "";
userPhotoUrl = u.photo_url || "";
}
const fullName = (userName + (userLastName ? " " + userLastName : "")).trim();

// ============ КОНСТАНТИ ============
const DAY_LIFETIME = 24 * 60 * 60 * 1000;
const COIN_REWARD_INTERVAL = 10;
const RESCUE_COST = 1;
const STAR_REWARD_PER_FEED = 1;

// ============ СТАН ============
let state = { coins: 3, stars: 50, days: 0, isAlive: true, lastFed: Date.now(), name: fullName };
let timerInterval = null, leaderboardUnsub = null, userDocUnsub = null, isProcessing = false;
let pendingPurchase = null; // { coins, price }

const $ = (id) => document.getElementById(id);
const avatarBox = $("avatarBox"), avatarLetter = $("avatarLetter"), avatarStatus = $("avatarStatus");
const profileName = $("profileName"), profileId = $("profileId");
const coinsValue = $("coinsValue"), starsValue = $("starsValue"), daysValue = $("daysValue");
const flameCard = $("flameCard"), flameEmoji = $("flameEmoji"), flameStatus = $("flameStatus");
const timerDisplay = $("timerDisplay"), timerLabel = $("timerLabel");
const btnFeed = $("btnFeed"), btnRescue = $("btnRescue");
const leaderboardList = $("leaderboardList"), loadingScreen = $("loadingScreen"), toastEl = $("toast");

function showToast(msg, d = 2200) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(() => toastEl.classList.remove("show"), d);
}

function formatTimerText(ms) {
    if (ms <= 0) return "00:00:00";
    const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    return `${h}г ${String(m).padStart(2, "0")}хв ${String(sec).padStart(2, "0")}с`;
}

function stringToGradient(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
    const h1 = Math.abs(hash) % 360, h2 = (h1 + 40) % 360;
    return `linear-gradient(135deg, hsl(${h1},75%,55%), hsl(${h2},80%,45%))`;
}

function setAvatar(box, letterEl, name, photoUrl) {
    const letter = (name || "?").charAt(0).toUpperCase();
    const existingImg = box.querySelector("img");
    if (existingImg) existingImg.remove();
    if (photoUrl) {
        const img = document.createElement("img");
        img.src = photoUrl; img.alt = name;
        img.onerror = () => { img.remove(); letterEl.style.display = "flex"; letterEl.textContent = letter; box.style.background = stringToGradient(name || "?"); };
        box.appendChild(img);
        letterEl.style.display = "none";
    } else {
        letterEl.style.display = "flex"; letterEl.textContent = letter;
        box.style.background = stringToGradient(name || "?");
    }
}

function msUntilNextFeed() {
    return DAY_LIFETIME - (Date.now() - state.lastFed);
}

function render() {
    setAvatar(avatarBox, avatarLetter, state.name, userPhotoUrl);
    avatarStatus.classList.toggle("offline", !state.isAlive);
    profileName.textContent = state.name || "Гравець";
    profileId.textContent = "ID: " + userId;
    coinsValue.textContent = state.coins;
    starsValue.textContent = state.stars;
    daysValue.textContent = state.days;

    if (state.isAlive) {
        flameCard.className = "flame-card alive";
        flameEmoji.textContent = "🔥";
        flameStatus.textContent = "Вогник горить!";
    } else {
        flameCard.className = "flame-card dead";
        flameEmoji.textContent = "💨";
        flameStatus.textContent = "Вогник згас!";
    }

    const msLeft = msUntilNextFeed();
    const canFeed = state.isAlive && msLeft <= 0;
    btnFeed.disabled = !canFeed;
    btnFeed.textContent = (state.isAlive && msLeft > 0)
        ? "🔥 Підкинути дров (незабаром)"
        : `🔥 Підкинути дров (+${STAR_REWARD_PER_FEED} ⭐)`;

    btnRescue.disabled = state.isAlive || state.coins < RESCUE_COST;
    updateTimer();
}

function updateTimer() {
    if (!state.isAlive) {
        timerDisplay.textContent = "Вогник згас!";
        timerDisplay.className = "timer red";
        timerLabel.textContent = "Потрібен порятунок";
        return;
    }
    const msLeft = msUntilNextFeed();
    if (msLeft <= 0) {
        timerDisplay.textContent = "Час підкинути дров!";
        timerDisplay.className = "timer orange";
        timerLabel.textContent = "Вогник чекає";
        return;
    }
    timerDisplay.textContent = formatTimerText(msLeft);
    timerDisplay.className = "timer green";
    timerLabel.textContent = "Наступне підкидання через";
}

async function initUser() {
    const userRef = doc(db, "players", userId);
    const snap = await getDoc(userRef);
    if (!snap.exists()) {
        const np = { coins: 3, stars: 50, days: 0, isAlive: true, lastFed: Date.now(), name: fullName, photoUrl: userPhotoUrl || "", createdAt: serverTimestamp() };
        await setDoc(userRef, np);
        state = { ...np };
    } else {
        const d = snap.data();
        state = {
            coins: d.coins ?? 3,
            stars: d.stars ?? 50,
            days: d.days ?? 0,
            isAlive: d.isAlive ?? true,
            lastFed: d.lastFed ?? Date.now(),
            name: d.name || fullName
        };
    }
    if (userDocUnsub) userDocUnsub();
    userDocUnsub = onSnapshot(userRef, (ds) => {
        if (!ds.exists()) return;
        const d = ds.data();
        state.coins = d.coins ?? state.coins;
        state.stars = d.stars ?? state.stars;
        state.days = d.days ?? state.days;
        state.isAlive = d.isAlive ?? state.isAlive;
        state.lastFed = d.lastFed ?? state.lastFed;
        state.name = d.name || state.name;
        render();
    });
    render();
}

async function updateFirestore(fields) {
    try { await updateDoc(doc(db, "players", userId), fields); }
    catch (e) { console.error(e); showToast("Помилка збереження"); }
}

async function checkFlameStatus() {
    if (!state.isAlive) return;
    if (Date.now() - state.lastFed >= DAY_LIFETIME) {
        state.isAlive = false;
        render();
        await updateFirestore({ isAlive: false });
        showToast("💨 Вогник згас! Потрібен порятунок.");
    }
}

async function onFeed() {
    if (isProcessing || !state.isAlive) return;
    const msLeft = msUntilNextFeed();
    if (msLeft > 0) { showToast("⏳ Наступне підкидання через " + formatTimerText(msLeft)); return; }

    isProcessing = true; btnFeed.disabled = true;
    try {
        const newDays = state.days + 1;
        const now = Date.now();
        const newStars = state.stars + STAR_REWARD_PER_FEED;
        let newCoins = state.coins;
        let coinEarned = false;
        if (newDays % COIN_REWARD_INTERVAL === 0) { newCoins++; coinEarned = true; }

        state.days = newDays; state.stars = newStars; state.coins = newCoins;
        state.lastFed = now; state.isAlive = true;
        render();

        await updateFirestore({ days: newDays, stars: newStars, coins: newCoins, lastFed: now, isAlive: true });

        let msg = `🔥 День ${newDays}! +${STAR_REWARD_PER_FEED} ⭐`;
        if (coinEarned) msg += ` і +1 🪙`;
        showToast(msg);
    } catch (e) { console.error(e); }
    finally { isProcessing = false; render(); }
}

async function onRescue() {
    if (isProcessing || state.isAlive || state.coins < RESCUE_COST) return;
    isProcessing = true; btnRescue.disabled = true;
    try {
        const newCoins = state.coins - RESCUE_COST;
        const now = Date.now();
        state.coins = newCoins; state.isAlive = true; state.lastFed = now;
        render();
        await updateFirestore({ coins: newCoins, isAlive: true, lastFed: now });
        showToast("❤️ Вогник врятовано!");
    } catch (e) { console.error(e); }
    finally { isProcessing = false; render(); }
}

// ============================================================
//  💳 КУПІВЛЯ МОНЕТ ЧЕРЕЗ TELEGRAM STARS (Invoice)
// ============================================================
// ВАЖЛИВО: щоб це працювало, потрібно:
// 1) Створити бота в @BotFather
// 2) Увімкнути Payments: /mybots → ваш бот → Payments → обрати провайдера
// 3) Або використати Telegram Stars (XTR currency) — платежі без провайдера
// ============================================================

async function buyCoins(coinsAmount, starPrice) {
    if (!tg || !tg.openInvoice) {
        // Резервний режим для браузера — просто нараховуємо "безкоштовно" (для тесту)
        showToast(`ℹ️ У браузері оплата недоступна. Нараховано ${coinsAmount} 🪙 (тест)`);
        state.coins += coinsAmount;
        render();
        await updateFirestore({ coins: increment(coinsAmount) });
        return;
    }

    // Зберігаємо, що саме купуємо — після успішної оплати нарахуємо

//  ЛІДЕРБОРД
// ============================================================
function initLeaderboard() {
    if (leaderboardUnsub) leaderboardUnsub();
    const q = query(collection(db, "players"), orderBy("days", "desc"), limit(10));
    leaderboardUnsub = onSnapshot(q, (snap) => {
        const players = [];
        snap.forEach((d) => {
            const data = d.data();
            players.push({ id: d.id, name: data.name || "Гравець", days: data.days || 0, isAlive: data.isAlive, photoUrl: data.photoUrl || "" });
        });
        renderLeaderboard(players);
    }, (err) => {
        console.error(err);
        leaderboardList.innerHTML = '<div class="lb-empty">Не вдалося завантажити</div>';
    });
}

function escapeHtml(str) { const d = document.createElement("div"); d.textContent = str; return d.innerHTML; }

function renderLeaderboard(players) {
    if (!players.length) { leaderboardList.innerHTML = '<div class="lb-empty">Поки що немає гравців</div>'; return; }
    let html = "";
    players.forEach((p, i) => {
        const rank = i + 1;
        let rc = "";
        if (rank === 1) rc = "gold"; else if (rank === 2) rc = "silver"; else if (rank === 3) rc = "bronze";
        const isCurrent = p.id === userId;
        const rowClass = isCurrent ? "lb-row current-user" : "lb-row";
        const flameIcon = p.isAlive ? "🔥" : "💨";
        const letter = (p.name || "?").charAt(0).toUpperCase();
        const gradient = stringToGradient(p.name || "?");
        const avatarContent = p.photoUrl
            ? `<img src="${p.photoUrl}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';this.nextElementSibling.textContent='${letter}';this.parentElement.style.background='${gradient}';">`
            : "";
        html += `<div class="${rowClass}">
            <div class="lb-rank ${rc}">${rank}</div>
            <div class="lb-avatar" style="background:${gradient}">${avatarContent}<span style="display:${p.photoUrl ? "none" : "flex"};width:100%;height:100%;align-items:center;justify-content:center;">${letter}</span></div>
            <div class="lb-name">${escapeHtml(p.name)} ${flameIcon}</div>
            <div class="lb-days">${p.days} дн</div>
        </div>`;
    });
    leaderboardList.innerHTML = html;
}

function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(async () => { updateTimer(); await checkFlameStatus(); }, 1000);
}

async function init() {
    try {
        await initUser();
        await checkFlameStatus();
        initLeaderboard();
        startTimer();
        btnFeed.addEventListener("click", onFeed);
        btnRescue.addEventListener("click", onRescue);
        setTimeout(() => loadingScreen.classList.add("hidden"), 400);
        render();
    } catch (e) {
        console.error("ПОМИЛКА:", e);
        loadingScreen.querySelector(".loading-text").textContent = "Помилка: " + e.message;
    }
}

init();

window.addEventListener("beforeunload", () => {
    if (timerInterval) clearInterval(timerInterval);
    if (leaderboardUnsub) leaderboardUnsub();
    if (userDocUnsub) userDocUnsub();
});
</script>
