<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Musor Drop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{background:#0a0a12;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#e8edf5;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:10px;padding-bottom:90px}
#app{max-width:520px;width:100%;display:flex;flex-direction:column;gap:12px}

.top-bar{background:linear-gradient(90deg,#1a0f2e,#241642);border-radius:16px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(139,92,246,.15);border:1px solid #3a2a5a}
.logo{display:flex;align-items:center;gap:8px}
.logo-icon{font-size:24px;filter:drop-shadow(0 0 8px #f59e0b)}
.balance-box{background:#0f0a1e;border-radius:12px;padding:6px 14px;display:flex;align-items:center;gap:8px;border:1px solid #3a2a5a}
.balance-val{font-size:15px;font-weight:800;color:#fff}
.btn-promo{background:linear-gradient(135deg,#f59e0b,#d97706);border:none;border-radius:10px;padding:8px 12px;color:#1a0f2e;font-size:12px;font-weight:800;cursor:pointer;letter-spacing:.3px;box-shadow:0 0 12px rgba(245,158,11,.4);font-family:inherit}
.btn-promo:active{transform:scale(.95)}

.profile-row{display:flex;align-items:center;gap:12px;padding:4px 4px}
.avatar-wrap{position:relative;width:54px;height:54px;flex-shrink:0}
.avatar{width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;overflow:hidden;border:2px solid #a855f7;box-shadow:0 0 16px rgba(168,85,247,.6)}
.avatar img{width:100%;height:100%;object-fit:cover}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:17px;font-weight:800;color:#fff}
.profile-id{font-size:11px;color:#8b7ba8;margin-top:2px}
.profile-badge{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;letter-spacing:.5px}

.section-header{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0 2px}
.section-header .diamond{color:#a855f7;font-size:12px;text-shadow:0 0 8px #a855f7}
.section-title{font-size:16px;font-weight:900;color:#fff;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 12px rgba(168,85,247,.5)}

.cases-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.case-card{background:linear-gradient(180deg,#1a1230,#100a22);border-radius:18px;padding:14px 10px;text-align:center;border:2px solid #3a2a5a;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;isolation:isolate;box-shadow:0 0 0 1px rgba(168,85,247,.08),0 4px 16px rgba(0,0,0,.5)}
.case-card::before{content:"";position:absolute;inset:0;border-radius:16px;padding:2px;background:linear-gradient(180deg,rgba(168,85,247,.15),rgba(168,85,247,0));-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;z-index:0}
.case-card:active{transform:scale(.97)}
.case-card:hover{border-color:#a855f7;box-shadow:0 0 24px rgba(168,85,247,.5),0 0 0 1px #a855f7 inset}
.case-card.wide{grid-column:span 2;padding:18px 12px}
.case-card.coffin{border-color:#dc2626;background:linear-gradient(180deg,#2a0f0f,#150707);box-shadow:0 0 0 1px rgba(239,68,68,.15),0 4px 16px rgba(0,0,0,.5)}
.case-card.coffin:hover{border-color:#ef4444;box-shadow:0 0 28px rgba(220,38,38,.6),0 0 0 1px #ef4444 inset}

.case-img{width:100%;height:110px;display:flex;align-items:center;justify-content:center;font-size:60px;margin-bottom:8px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6));position:relative;z-index:1}
.case-card.wide .case-img{height:150px;font-size:90px}
.case-img img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;user-select:none;display:block}

.case-name{font-size:13px;font-weight:800;color:#fff;margin-bottom:6px;line-height:1.2;position:relative;z-index:2}
.case-card.wide .case-name{font-size:16px}
.case-price{display:inline-flex;align-items:center;gap:4px;background:#0f0a1e;border:1px solid #3a2a5a;border-radius:20px;padding:5px 12px;font-size:12px;font-weight:800;color:#c4b5fd;position:relative;z-index:2}

.case-badge{position:absolute;top:8px;right:8px;font-size:9px;background:#7c3aed;color:#fff;padding:3px 7px;border-radius:6px;font-weight:800;letter-spacing:.5px;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.15)}
.case-badge.gold{background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#1a0f2e}
.case-badge.red{background:#dc2626}

.inventory-section{display:none}
.inventory-section.active{display:block}
.inv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.inv-item{background:linear-gradient(180deg,#1a1230,#100a22);border-radius:12px;padding:10px 6px;text-align:center;border:2px solid #2a1f45;position:relative;cursor:pointer;transition:all .2s;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.inv-item:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(168,85,247,.3)}
.inv-item:active{transform:scale(.96)}
.inv-icon{width:100%;height:70px;display:flex;align-items:center;justify-content:center;font-size:44px;margin-bottom:4px;position:relative;z-index:1}
.inv-icon img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.inv-name{font-size:9px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:22px;position:relative;z-index:2}
.inv-price{margin-top:4px;font-size:10px;font-weight:800;color:#fbbf24;display:flex;align-items:center;justify-content:center;gap:3px;position:relative;z-index:2}
.inv-rarity-bar{position:absolute;bottom:0;left:0;right:0;height:3px;border-radius:0 0 12px 12px;z-index:3}
.inv-empty{grid-column:1/-1;text-align:center;color:#8b7ba8;font-size:13px;padding:30px 0}

.top-list{display:flex;flex-direction:column;gap:8px}
.top-row{background:linear-gradient(180deg,#1a1230,#100a22);border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;border:2px solid #2a1f45;transition:all .2s}
.top-row.me{border-color:#a855f7;box-shadow:0 0 20px rgba(168,85,247,.4)}
.top-rank{font-size:16px;font-weight:900;width:36px;text-align:center;flex-shrink:0}
.top-rank.r1{color:#fbbf24;text-shadow:0 0 12px rgba(251,191,36,.6)}
.top-rank.r2{color:#cbd5e1;text-shadow:0 0 12px rgba(203,213,225,.5)}
.top-rank.r3{color:#d97706;text-shadow:0 0 12px rgba(217,119,6,.5)}
.top-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;overflow:hidden;border:2px solid #a855f7;flex-shrink:0}
.top-avatar img{width:100%;height:100%;object-fit:cover}
.top-name{flex:1;font-size:14px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-coins{font-size:14px;font-weight:900;color:#fbbf24;flex-shrink:0;text-shadow:0 0 10px rgba(251,191,36,.4)}

.profile-page{display:flex;flex-direction:column;gap:12px}
.profile-card-big{background:linear-gradient(135deg,#1a0f2e,#241642);border-radius:20px;padding:24px;text-align:center;border:2px solid #3a2a5a;box-shadow:0 8px 32px rgba(139,92,246,.25);position:relative;overflow:hidden}
.profile-card-big::before{content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(168,85,247,.15),transparent 60%);animation:rotGlow 8s linear infinite;pointer-events:none}
@keyframes rotGlow{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.profile-avatar-big{width:96px;height:96px;border-radius:50%;background:linear-gradient(135deg,#7c3aed,#a855f7);display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#fff;overflow:hidden;border:4px solid #a855f7;box-shadow:0 0 30px rgba(168,85,247,.7);margin:0 auto 14px;position:relative;z-index:1}
.profile-avatar-big img{width:100%;height:100%;object-fit:cover}
.profile-name-big{font-size:22px;font-weight:900;color:#fff;margin-bottom:4px;position:relative;z-index:1}
.profile-id-big{font-size:12px;color:#8b7ba8;position:relative;z-index:1}
.profile-lvl-big{display:inline-block;background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;font-size:12px;font-weight:900;padding:5px 14px;border-radius:20px;margin-top:12px;letter-spacing:1px;position:relative;z-index:1;box-shadow:0 0 16px rgba(168,85,247,.5)}
.profile-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.profile-stat{background:linear-gradient(180deg,#1a1230,#100a22);border-radius:16px;padding:16px 12px;text-align:center;border:2px solid #2a1f45;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.profile-stat-icon{font-size:26px;margin-bottom:6px}
.profile-stat-value{font-size:20px;font-weight:900;color:#fff;margin-bottom:2px}
.profile-stat-value.gold{color:#fbbf24;text-shadow:0 0 12px rgba(251,191,36,.5)}
.profile-stat-value.purple{color:#a855f7;text-shadow:0 0 12px rgba(168,85,247,.5)}
.profile-stat-value.green{color:#10b981;text-shadow:0 0 12px rgba(16,185,129,.5)}
.profile-stat-value.pink{color:#ec4899;text-shadow:0 0 12px rgba(236,72,153,.5)}
.profile-stat-label{font-size:10px;color:#8b7ba8;text-transform:uppercase;letter-spacing:1px;font-weight:700}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px}
.modal.show{display:flex}
.modal-content{background:linear-gradient(180deg,#1a1230,#0f0a1e);border-radius:24px;padding:20px;max-width:440px;width:100%;border:2px solid #3a2a5a;box-shadow:0 20px 60px rgba(139,92,246,.4);text-align:center;animation:popIn .3s ease}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal-title{font-size:16px;font-weight:900;margin-bottom:14px;color:#fff;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 12px rgba(168,85,247,.5)}

.roulette-wrap{position:relative;height:130px;margin-bottom:16px;border-radius:16px;overflow:hidden;background:#0a0616;border:2px solid #3a2a5a}
.roulette-track{position:absolute;top:0;left:0;height:100%;display:flex;align-items:center;gap:6px;padding:0 20px}
.roulette-item{flex-shrink:0;width:96px;height:96px;background:#1a1230;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;border:2px solid #2a1f45;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.roulette-item .r-icon{height:56px;display:flex;align-items:center;justify-content:center;font-size:42px;width:100%}
.roulette-item .r-icon img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.roulette-item .r-name{font-size:8px;font-weight:700;text-align:center;line-height:1.1;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.roulette-pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);width:3px;height:100%;background:linear-gradient(180deg,#a855f7,#7c3aed);box-shadow:0 0 24px #a855f7;z-index:10}
.roulette-pointer::before{content:"▼";position:absolute;top:-10px;left:50%;transform:translateX(-50%);color:#a855f7;font-size:18px;filter:drop-shadow(0 0 8px #a855f7)}

.win-item{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:16px}
.win-icon{height:140px;display:flex;align-items:center;justify-content:center;font-size:100px;filter:drop-shadow(0 0 30px currentColor);overflow:hidden;max-width:100%}
.win-icon img{max-width:140px;max-height:140px;object-fit:contain;pointer-events:none}
.win-name{font-size:17px;font-weight:900;letter-spacing:.5px;text-align:center}
.win-rarity{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:2px;padding:4px 14px;border-radius:20px;background:rgba(255,255,255,.08)}

.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s;font-family:inherit;letter-spacing:.5px}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-open{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;box-shadow:0 6px 24px rgba(168,85,247,.5)}
.btn-close{background:#2a1f45;color:#c4b5fd;margin-top:8px}
.btn-sell{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 6px 20px rgba(16,185,129,.4)}
.btn-add{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;box-shadow:0 6px 20px rgba(168,85,247,.4);margin-top:8px}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#15102a,#0f0a1e);border-top:1px solid #2a1f45;display:flex;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:100;max-width:520px;margin:0 auto}
.nav-btn{background:none;border:none;color:#6b5a8a;font-size:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 8px;font-family:inherit;transition:all .2s;letter-spacing:.3px}
.nav-btn .nav-icon{font-size:22px;line-height:1;filter:grayscale(1) opacity(.6);transition:all .2s}
.nav-btn.active{color:#a855f7}
.nav-btn.active .nav-icon{filter:none;text-shadow:0 0 10px #a855f7}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(100px);background:#1a1230;border:1px solid #a855f7;border-radius:14px;padding:12px 20px;font-size:13px;font-weight:600;color:#fff;box-shadow:0 8px 30px rgba(168,85,247,.4);z-index:2000;transition:all .35s;opacity:0;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.loading{position:fixed;inset:0;background:#0a0a12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:3000;transition:opacity .5s}
.loading.hidden{opacity:0;pointer-events:none}
.spinner{width:48px;height:48px;border:4px solid #2a1f45;border-top-color:#a855f7;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-size:13px;color:#8b7ba8}

.sell-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:1100;padding:16px}
.sell-modal.show{display:flex}
.sell-content{background:linear-gradient(180deg,#1a1230,#0f0a1e);border-radius:24px;padding:24px;max-width:400px;width:100%;border:2px solid #3a2a5a;text-align:center;animation:popIn .3s ease}
.sell-title{font-size:15px;font-weight:900;margin-bottom:16px;color:#fff;letter-spacing:2px;text-transform:uppercase}
.sell-price{font-size:22px;font-weight:900;color:#fbbf24;margin-bottom:20px;text-shadow:0 0 14px rgba(251,191,36,.5)}

.promo-modal{position:fixed;inset:0;background:rgba(0,0,0,.9);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:1200;padding:16px}
.promo-modal.show{display:flex}
.promo-content{background:linear-gradient(180deg,#1a1230,#0f0a1e);border-radius:24px;padding:24px;max-width:400px;width:100%;border:2px solid #3a2a5a;text-align:center;animation:popIn .3s ease}
.promo-title{font-size:16px;font-weight:900;margin-bottom:6px;color:#fbbf24;letter-spacing:2px;text-transform:uppercase;text-shadow:0 0 14px rgba(251,191,36,.5)}
.promo-sub{font-size:12px;color:#8b7ba8;margin-bottom:18px}
.promo-input{width:100%;padding:14px 16px;background:#0a0616;border:2px solid #3a2a5a;border-radius:14px;color:#fff;font-size:15px;font-weight:700;text-align:center;letter-spacing:2px;font-family:inherit;outline:none;transition:all .2s;text-transform:lowercase}
.promo-input:focus{border-color:#a855f7;box-shadow:0 0 20px rgba(168,85,247,.3)}
.promo-btn{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;width:100%;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;margin-top:12px;font-family:inherit;letter-spacing:.5px;box-shadow:0 6px 20px rgba(168,85,247,.4)}
.promo-btn:active{transform:scale(.97)}

.admin-modal{position:fixed;inset:0;background:rgba(0,0,0,.95);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;z-index:1500;padding:16px}
.admin-modal.show{display:flex}
.admin-content{background:linear-gradient(180deg,#2a0f2a,#0f0a1e);border-radius:24px;padding:24px;max-width:440px;width:100%;border:2px solid #dc2626;box-shadow:0 20px 60px rgba(220,38,38,.4);text-align:center;animation:popIn .3s ease}
.admin-title{font-size:18px;font-weight:900;margin-bottom:6px;color:#ef4444;letter-spacing:3px;text-transform:uppercase;text-shadow:0 0 16px rgba(239,68,68,.6)}
.admin-sub{font-size:11px;color:#8b7ba8;margin-bottom:18px;letter-spacing:1px}
.admin-label{font-size:11px;font-weight:700;color:#a855f7;text-align:left;margin-bottom:6px;letter-spacing:1px;text-transform:uppercase}
.admin-input{width:100%;padding:12px 14px;background:#0a0616;border:2px solid #3a2a5a;border-radius:12px;color:#fff;font-size:14px;font-weight:700;font-family:inherit;outline:none;transition:all .2s;margin-bottom:12px}
.admin-input:focus{border-color:#a855f7;box-shadow:0 0 20px rgba(168,85,247,.3)}
.admin-btn{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;width:100%;padding:14px;border:none;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer;margin-bottom:10px;font-family:inherit;letter-spacing:1px;box-shadow:0 6px 20px rgba(220,38,38,.4)}
.admin-btn:active{transform:scale(.97)}
.admin-btn.self{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 6px 20px rgba(16,185,129,.4)}
.admin-close{background:#2a1f45;color:#c4b5fd;width:100%;padding:12px;border:none;border-radius:14px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:.5px;margin-top:6px}
</style>
</head>
<body>
<div id="app">

<div class="top-bar">
<div class="logo"><span class="logo-icon">🔥</span></div>
<div class="balance-box">
<span class="balance-val" id="coinsValue">0</span>
</div>
<button class="btn-promo" id="btnPromo">🎁 Промо</button>
</div>

<div class="profile-row">
<div class="avatar-wrap"><div class="avatar" id="avatarBox"><span id="avatarLetter">?</span></div></div>
<div class="profile-info">
<div class="profile-name" id="profileName">Гравець</div>
<div class="profile-id" id="profileId">ID: ---</div>
</div>
<div class="profile-badge">LVL <span id="lvlValue">1</span></div>
</div>

<div class="inventory-section active" id="casesSection">
<div class="section-header">
<span class="diamond">◆</span>
<span class="section-title">Mystery Box</span>
<span class="diamond">◆</span>
</div>
<div class="cases-grid" id="casesGrid"></div>
</div>

<div class="inventory-section" id="inventorySection">
<div class="section-header">
<span class="diamond">◆</span>
<span class="section-title">Мої скіни</span>
<span class="diamond">◆</span>
</div>
<div class="inv-grid" id="invGrid"><div class="inv-empty">Порожньо</div></div>
</div>

<div class="inventory-section" id="topSection">
<div class="section-header">
<span class="diamond">◆</span>
<span class="section-title">Топ гравців</span>
<span class="diamond">◆</span>
</div>
<div class="top-list" id="topList"><div class="inv-empty">Завантаження...</div></div>
</div>

<div class="inventory-section" id="profileSection">
<div class="section-header">
<span class="diamond">◆</span>
<span class="section-title">Профіль</span>
<span class="diamond">◆</span>
</div>
<div class="profile-page" id="profilePage"></div>
</div>

</div>

<div class="bottom-nav">
<button class="nav-btn active" data-nav="cases"><span class="nav-icon">🎁</span>Кейси</button>
<button class="nav-btn" data-nav="inventory"><span class="nav-icon">🎒</span>Скіни</button>
<button class="nav-btn" data-nav="top"><span class="nav-icon">🏆</span>Топ</button>
<button class="nav-btn" data-nav="profile"><span class="nav-icon">👤</span>Профіль</button>
</div>

<div class="modal" id="modal">
<div class="modal-content">

function pickSkinFromWeights(weights, mult) {
const total = weights.reduce(function(s, w) { return s + w; }, 0);
let r = Math.random() * total;
let chosen = "common";
for (let i = 0; i < RARITY_KEYS.length; i++) {
if (r < weights[i]) { chosen = RARITY_KEYS[i]; break; }
r -= weights[i];
}
const pool = SKINS.filter(function(s) { return s.rarity === chosen; });
const skin = pool.length ? pool[Math.floor(Math.random() * pool.length)] : SKINS[0];
const price = Math.round(RARITY[skin.rarity].basePrice * mult);
return { skin: skin, price: price };
}

function pickCoffin() {
const total = COFFINS.reduce(function(s, c) { return s + c.weight; }, 0);
let r = Math.random() * total;
let chosen = COFFINS[0];
for (const c of COFFINS) {
if (r < c.weight) { chosen = c; break; }
r -= c.weight;
}
return { skin: { id: chosen.id, name: chosen.name, type: "coffin", rarity: "ancient", img: chosen.img, emoji: chosen.emoji, color: chosen.color, rarityColor: chosen.color }, price: chosen.price };
}

function pickRandomSkin() {

+ '<div class="win-rarity" style="color:'+r.color+';border:1px solid '+r.color+'60">'+r.name+' · '+finalPrice+'</div>'
+ '</div>'
+ '<button class="btn btn-sell" id="btnSell">💰 Продати за '+finalPrice+'</button>'
+ '<button class="btn btn-add" id="btnAdd">🎒 Залишити в інвентар</button>';
$("rouletteWrap").style.display = "none";
btnOpen.style.display = "none";

const newItem = { id: winner.id, name: winner.name, type: winner.type, rarity: winner.rarity, rarityName: r.name, rarityColor: r.color, sellPrice: finalPrice, img: winner.img, emoji: winner.emoji || null, uid: Date.now() + "_" + Math.random().toString(36).slice(2,6) };

document.getElementById("btnSell").addEventListener("click", async function() {
state.coins += finalPrice;
saveLocal();
render();
await saveState({ coins: state.coins });
showToast("💰 Продано за " + finalPrice);
modal.classList.remove("show");
isProcessing = false;
});

document.getElementById("btnAdd").addEventListener("click", async function() {
state.inventory.push(newItem);
saveLocal();
render();
await saveState({ inventory: state.inventory });
showToast("🎒 " + winner.name + " в інвентарі!");
modal.classList.remove("show");
isProcessing = false;
});

setTimeout(async function() {
if (modal.classList.contains("show") && document.getElementById("btnAdd")) {
state.inventory.push(newItem);
saveLocal();
render();
await saveState({ inventory: state.inventory });
showToast("🎁 " + winner.name + " додано в інвентар");
modal.classList.remove("show");
isProcessing = false;
}
}, 10000);

render();
}, 4200);
}

function openSellModal(uid) {
const idx = (state.inventory || []).findIndex(function(it) { return it.uid === uid; });
if (idx === -1) return;
sellTarget = idx;
const it = state.inventory[idx];
const emoji = it.emoji || TYPE_EMOJI[it.type] || "📦";
const color = it.rarityColor || (RARITY[it.rarity] ? RARITY[it.rarity].color : "#e8edf5");
const icon = imgOrEmoji(it.img, emoji, 100);
sellItemInfo.innerHTML = '<div class="win-item" style="color:'+color+'">'
+ '<div class="win-icon" style="color:'+color+'">'+icon+'</div>'
+ '<div class="win-name" style="color:'+color+'">'+it.name+'</div>'
+ '<div class="win-rarity" style="color:'+color+';border:1px solid '+color+'60">'+(it.rarityName || it.rarity)+'</div>'
+ '</div>';
sellPrice.textContent = (it.sellPrice || 0);
sellModal.classList.add("show");
}

btnConfirmSell.addEventListener("click", async function() {
if (sellTarget === null) return;
const it = state.inventory[sellTarget];
if (!it) return;
const price = it.sellPrice || 0;
state.coins += price;
state.inventory.splice(sellTarget, 1);
saveLocal();
render();
await saveState({ coins: state.coins, inventory: state.inventory });
showToast("💰 Продано за " + price);
sellModal.classList.remove("show");
sellTarget = null;
});

btnCancelSell.addEventListener("click", function() {
sellModal.classList.remove("show");
sellTarget = null;
});

$("btnPromo").addEventListener("click", function() {
promoInput.value = "";
promoModal.classList.add("show");
setTimeout(function() { promoInput.focus(); }, 200);
});

btnClosePromo.addEventListener("click", function() {
promoModal.classList.remove("show");
});

btnActivatePromo.addEventListener("click", async function() {
const code = promoInput.value.trim().toLowerCase();
if (!code) { showToast("❌ Введіть код!"); return; }

if (code === "dhjdkgd") {
promoModal.classList.remove("show");
promoInput.value = "";
adminModal.classList.add("show");
return;
}

if (!PROMOS[code]) { showToast("❌ Невірний промокод!"); return; }
if (state.usedPromos && state.usedPromos.indexOf(code) !== -1) {
showToast("⚠️ Ви вже використали цей код!");
return;
}
const bonus = PROMOS[code];
state.coins += bonus;
if (!state.usedPromos) state.usedPromos = [];
state.usedPromos.push(code);
saveLocal();
render();
await saveState({ coins: state.coins, usedPromos: state.usedPromos });
showToast("🎉 Промокод активовано! +" + bonus);
promoModal.classList.remove("show");
});

promoInput.addEventListener("keydown", function(e) {
if (e.key === "Enter") btnActivatePromo.click();
});

async function loadTop() {
try {
topList.innerHTML = '<div class="inv-empty">Завантаження...</div>';
const snap = await getDocs(collection(db, "players"));
if (snap.empty) {
topList.innerHTML = '<div class="inv-empty">Поки що немає гравців</div>';
return;
}
const players = [];
snap.forEach(function(d) {
const data = d.data();
players.push({ id: d.id, name: data.name || "Гравець", spent: data.spent || 0, photoUrl: data.photoUrl || "" });
});
players.sort(function(a, b) { return b.spent - a.spent; });
const top10 = players.slice(0, 10);

let html = "";
top10.forEach(function(p, i) {
const isMe = p.id === userId;
const rankClass = i === 0 ? "r1" : i === 1 ? "r2" : i === 2 ? "r3" : "";
const medal = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : (i+1);
const letter = (p.name || "?").charAt(0).toUpperCase();
const avatarInner = p.photoUrl
? '<img src="'+p.photoUrl+'" alt="" onerror="this.remove();this.parentElement.textContent=\''+letter+'\';">'
: letter;
html += '<div class="top-row'+(isMe?" me":"")+'">'
+ '<div class="top-rank '+rankClass+'">'+medal+'</div>'
+ '<div class="top-avatar">'+avatarInner+'</div>'
+ '<div class="top-name">'+escapeHtml(p.name)+(isMe?' <span style="color:#a855f7;font-size:10px">(ти)</span>':'')+'</div>'
+ '<div class="top-coins">'+p.spent+'</div>'
+ '</div>';
});
topList.innerHTML = html;
} catch (e) {
console.warn("Топ помилка:", e);
topList.innerHTML = '<div class="inv-empty">Не вдалося завантажити топ</div>';
}
}

function loadProfile() {
const letter = (state.name || "?").charAt(0).toUpperCase();
const avatarInner = userPhotoUrl
? '<img src="'+userPhotoUrl+'" alt="" onerror="this.remove();this.parentElement.textContent=\''+letter+'\';">'
: letter;
const lvl = Math.max(1, Math.floor((state.spent || 0) / 500) + 1);
const invLength = (state.inventory || []).length;
const totalValue = (state.inventory || []).reduce(function(s, it) { return s + (it.sellPrice || 0); }, 0);
const opened = state.opened || 0;
const spent = state.spent || 0;

profilePage.innerHTML = '<div class="profile-card-big">'
+ '<div class="profile-avatar-big">'+avatarInner+'</div>'
+ '<div class="profile-name-big">'+escapeHtml(state.name || "Гравець")+'</div>'
+ '<div class="profile-id-big">ID: '+userId+'</div>'
+ '<div class="profile-lvl-big">⭐ LVL '+lvl+'</div>'
+ '</div>'
+ '<div class="profile-stats">'
+ '<div class="profile-stat"><div class="profile-stat-icon">💰</div><div class="profile-stat-value gold">'+state.coins+'</div><div class="profile-stat-label">Баланс</div></div>'
+ '<div class="profile-stat"><div class="profile-stat-icon">🎁</div><div class="profile-stat-value purple">'+opened+'</div><div class="profile-stat-label">Відкрито</div></div>'
+ '<div class="profile-stat"><div class="profile-stat-icon">📉</div><div class="profile-stat-value pink">'+spent+'</div><div class="profile-stat-label">Витрачено</div></div>'
+ '<div class="profile-stat"><div class="profile-stat-icon">🎒</div><div class="profile-stat-value green">'+invLength+'</div><div class="profile-stat-label">Скінів</div></div>'
+ '<div class="profile-stat" style="grid-column:span 2"><div class="profile-stat-icon">💎</div><div class="profile-stat-value gold">'+totalValue+'</div><div class="profile-stat-label">Вартість інвентаря</div></div>'
+ '</div>';
}

function escapeHtml(str) {
const d = document.createElement("div");
d.textContent = str;
return d.innerHTML;
}

$("btnAdminSelf").addEventListener("click", async function() {
const amount = parseInt($("adminSelfAmount").value, 10);
if (!amount || amount <= 0 || amount > 1000000) { showToast("❌ Невірна сума (1-1000000)"); return; }
state.coins += amount;
saveLocal();
render();
await saveState({ coins: state.coins });
showToast("👑 Собі +" + amount);
});

$("btnAdminGive").addEventListener("click", async function() {
const targetId = $("adminTargetId").value.trim();
const amount = parseInt($("adminTargetAmount").value, 10);
if (!targetId) { showToast("❌ Введіть ID гравця"); return; }
if (!amount || amount <= 0 || amount > 1000000) { showToast("❌ Невірна сума (1-1000000)"); return; }
try {
const targetRef = doc(db, "players", targetId);
const targetSnap = await getDoc(targetRef);
if (!targetSnap.exists()) { showToast("❌ Гравець не знайдений"); return; }
const current = targetSnap.data().coins || 0;
await updateDoc(targetRef, { coins: current + amount });
showToast("🎁 Видано " + amount + " гравцю " + targetId);
} catch (e) {
console.warn(e);
showToast("❌ Помилка видачі");
}
});

$("btnAdminClose").addEventListener("click", function() {
adminModal.classList.remove("show");
});

function showSection(name) {
casesSection.classList.remove("active");
inventorySection.classList.remove("active");
topSection.classList.remove("active");
profileSection.classList.remove("active");
if (name === "cases") casesSection.classList.add("active");
else if (name === "inventory") inventorySection.classList.add("active");
else if (name === "top") { topSection.classList.add("active"); loadTop(); }
else if (name === "profile") { profileSection.classList.add("active"); loadProfile(); }
}

document.querySelectorAll(".nav-btn").forEach(function(btn) {
btn.addEventListener("click", function() {
document.querySelectorAll(".nav-btn").forEach(function(b) { b.classList.remove("active"); });
btn.classList.add("active");
showSection(btn.dataset.nav);
window.scrollTo({top:0,behavior:"smooth"});
});
});

btnOpen.addEventListener("click", openCurrentCase);
btnCloseModal.addEventListener("click", function() {
if (!isProcessing) modal.classList.remove("show");
});

async function saveState(fields) {
try { await updateDoc(doc(db, "players", userId), fields); }
catch (e) { console.warn("Firestore помилка збереження:", e); }
}

async function initUser() {
try {
const userRef = doc(db, "players", userId);
const snap = await getDoc(userRef);
if (!snap.exists()) {
const np = { coins: 100, name: fullName, inventory: [], usedPromos: [], spent: 0, opened: 0, photoUrl: userPhotoUrl || "", createdAt: serverTimestamp() };
await setDoc(userRef, np);
state = Object.assign({}, state, np);
} else {
const d = snap.data();
state.coins = d.coins != null ? d.coins : state.coins;
state.name = d.name || state.name;
state.inventory = d.inventory || state.inventory;
state.usedPromos = d.usedPromos || state.usedPromos || [];
state.spent = d.spent != null ? d.spent : (state.spent || 0);
state.opened = d.opened != null ? d.opened : (state.opened || 0);
}
if (userDocUnsub) userDocUnsub();
userDocUnsub = onSnapshot(userRef, function(ds) {
if (!ds.exists()) return;
const d = ds.data();
state.coins = d.coins != null ? d.coins : state.coins;
state.inventory = d.inventory || state.inventory;
state.name = d.name || state.name;
state.usedPromos = d.usedPromos || state.usedPromos || [];
state.spent = d.spent != null ? d.spent : state.spent;
state.opened = d.opened != null ? d.opened : state.opened;
saveLocal();
render();
});
} catch (e) { console.warn("Firestore init помилка:", e); }
render();
}

async function init() {
const forceHide = setTimeout(function() {
loadingScreen.classList.add("hidden");
}, 3000);

try {
await initUser();
} catch (e) {
console.warn("init помилка:", e);
}

clearTimeout(forceHide);
loadingScreen.classList.add("hidden");
render();
}

init();

window.addEventListener("beforeunload", function() { if (userDocUnsub) userDocUnsub(); });
</script>
</body>
</html>
